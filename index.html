<title>Quiz Dashboard</title>
<style>
  /* Deliberately single-theme: a dark broadcast "stage" is the concept,
     not a light/dark toggle target — kept legible either way via high contrast. */
  :root{
    --stage-navy:#0a2233;
    --stage-navy-2:#071824;
    --marquee-gold:#f5b60e;
    --card-cream:#fbf2d9;
    --ink:#1c1408;
    --buzz-red:#e2453c;
    --team-a:#4fc3f7;
    --team-b:#ff8a5c;
    --team-c:#b39ddb;
    --team-d:#81c995;
    --team-e:#f48fb1;
    --team-f:#4db6ac;
    --line: rgba(245,182,14,0.18);
    --display: "Arial Black", "Arial Bold", "Segoe UI Black", system-ui, sans-serif;
    --body: "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  *{ box-sizing:border-box; }

  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: clamp(16px, 4vw, 48px) 16px;
    background:
      radial-gradient(120% 90% at 50% -10%, #103349 0%, var(--stage-navy) 45%, var(--stage-navy-2) 100%);
    font-family: var(--body);
    color: var(--card-cream);
  }

  .stage{
    width:100%;
    max-width: 1180px;
    display:flex;
    flex-direction:column;
    gap: 22px;
  }

  /* ---------- Marquee ---------- */
  .marquee{
    display:flex;
    align-items:center;
    gap:18px;
    padding: 6px 4px;
  }

  .buzzer-mark{
    flex: none;
    width:52px; height:52px;
    border-radius:50%;
    background:
      radial-gradient(circle at 35% 30%, #ff8a80 0%, var(--buzz-red) 55%, #9c231c 100%);
    box-shadow: 0 0 0 4px rgba(226,69,60,0.15), 0 0 22px rgba(226,69,60,0.55);
    position:relative;
  }
  .buzzer-mark::after{
    content:"";
    position:absolute; inset:-8px;
    border-radius:50%;
    border:2px solid rgba(226,69,60,0.4);
    animation: pulse-ring 2.4s ease-out infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .buzzer-mark::after{ animation:none; }
  }
  @keyframes pulse-ring{
    0%{ transform:scale(0.85); opacity:0.9; }
    100%{ transform:scale(1.35); opacity:0; }
  }

  .marquee-text h1{
    margin:0;
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(28px, 4vw, 42px);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--marquee-gold);
    text-shadow: 0 0 18px rgba(245,182,14,0.35);
    outline: none;
    border-radius: 4px;
    padding: 2px 6px;
    margin-left: -6px;
  }
  .marquee-text h1:hover, .marquee-text h1:focus{
    background: rgba(245,182,14,0.08);
  }
  .marquee-sub{
    margin: 2px 0 0;
    font-size: 13px;
    letter-spacing: 0.02em;
    color: rgba(251,242,217,0.62);
  }
  .marquee-sub span{
    font-variant-numeric: tabular-nums;
    color: var(--marquee-gold);
    font-weight:600;
  }

  /* ---------- Scoreboard ---------- */
  .scoreboard{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 10px;
  }
  .team-card{
    position: relative;
    overflow: hidden;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    border: 1px solid rgba(251,242,217,0.14);
    border-radius: 12px;
    padding: 12px 18px;
  }
  .team-card::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0;
    width: 5px;
    background: var(--team-color);
  }
  .team-card.team-a{ --team-color: var(--team-a); }
  .team-card.team-b{ --team-color: var(--team-b); }
  .team-card.team-c{ --team-color: var(--team-c); }
  .team-card.team-d{ --team-color: var(--team-d); }
  .team-card.team-e{ --team-color: var(--team-e); }
  .team-card.team-f{ --team-color: var(--team-f); }

  .team-main{
    display:flex;
    flex-direction:column;
    gap: 2px;
    min-width: 0;
  }
  .team-name{
    font-family: var(--display);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    font-size: clamp(12px, 1.6vw, 15px);
    outline: none;
    border-radius: 4px;
    padding: 2px 6px;
    margin-left: -6px;
    cursor: text;
  }
  .team-name:hover, .team-name:focus{ background: rgba(251,242,217,0.08); }
  .team-roster{
    font-size: 11px;
    color: rgba(251,242,217,0.5);
    padding: 0 6px;
    line-height:1.4;
  }
  .team-score{
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(24px, 4vw, 34px);
    font-variant-numeric: tabular-nums;
    color: var(--team-color);
    outline: none;
    border-radius: 6px;
    padding: 0 6px;
    cursor: text;
    min-width: 1.3em;
    text-align: right;
    flex: none;
  }
  .team-score:hover, .team-score:focus{ background: rgba(251,242,217,0.08); }

  .team-card.active-turn{
    border-color: var(--team-color);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--team-color) 55%, transparent), 0 6px 16px rgba(0,0,0,0.3);
  }

  /* ---------- Turn banner ---------- */
  .turn-banner{
    display:flex;
    align-items:center;
    gap: 10px;
    font-family: var(--display);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    font-size: clamp(13px, 1.8vw, 16px);
    color: var(--turn-color, var(--marquee-gold));
    background: color-mix(in srgb, var(--turn-color, var(--marquee-gold)) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--turn-color, var(--marquee-gold)) 40%, transparent);
    border-radius: 12px;
    padding: 10px 18px;
  }
  .turn-banner::before{
    content: "🎯";
    font-size: 16px;
  }
  .turn-banner:empty{ display:none; }

  /* ---------- Controls ---------- */
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  button{
    font-family: var(--body);
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--marquee-gold);
    background: rgba(245,182,14,0.08);
    border: 1.5px solid rgba(245,182,14,0.45);
    border-radius: 999px;
    padding: 9px 18px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button:hover{ background: rgba(245,182,14,0.18); }
  button:active{ transform: scale(0.97); }
  button:focus-visible{ outline: 2px solid var(--marquee-gold); outline-offset: 2px; }
  button.danger{
    color:#ffcfc9;
    border-color: rgba(226,69,60,0.5);
    background: rgba(226,69,60,0.1);
  }
  button.danger:hover{ background: rgba(226,69,60,0.2); }
  button.ghost{
    background:transparent;
    color: rgba(251,242,217,0.7);
    border-color: rgba(251,242,217,0.25);
  }
  .controls .spacer{ flex:1; }

  /* ---------- Board ---------- */
  .board{
    display:grid;
    grid-template-columns: repeat(var(--cols), minmax(0,1fr));
    gap: 6px;
    background: var(--stage-navy-2);
    padding: 8px;
    border-radius: 14px;
    border: 1px solid rgba(245,182,14,0.15);
    box-shadow: 0 20px 60px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(0,0,0,0.3);
  }

  .topic-cell{
    background: linear-gradient(180deg, #ffd23f 0%, var(--marquee-gold) 100%);
    color: var(--ink);
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(11px, 1.5vw, 14px);
    text-transform: uppercase;
    letter-spacing: 0.01em;
    line-height: 1.25;
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height: 64px;
    padding: 8px 8px;
    border-radius: 6px;
    outline: none;
    cursor: text;
    border: 2px solid transparent;
  }
  .topic-cell:hover{ border-color: rgba(28,20,8,0.25); }
  .topic-cell:focus{ border-color: var(--ink); background: linear-gradient(180deg, #ffe27a 0%, #ffd23f 100%); }

  .tile{
    position: relative;
    background: var(--card-cream);
    color: var(--ink);
    font-family: var(--display);
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    font-size: clamp(20px, 3vw, 30px);
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    gap: 2px;
    min-height: 68px;
    border-radius: 6px;
    cursor: pointer;
    border: none;
    width:100%;
    box-shadow: inset 0 -3px 0 rgba(28,20,8,0.15);
    transition: transform 0.08s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .tile:hover{
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.35), inset 0 -3px 0 rgba(28,20,8,0.15);
  }
  .tile:focus-visible{ outline: 3px solid var(--buzz-red); outline-offset: 2px; }

  .tile-edit{
    position: absolute;
    top: 4px;
    right: 4px;
    width: 22px;
    height: 22px;
    padding: 0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 12px;
    line-height:1;
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
    color: var(--ink);
    background: rgba(28,20,8,0.08);
    border: none;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.12s ease, background 0.12s ease;
  }
  .tile.has-content .tile-edit{ opacity: 0.55; }
  .tile:hover .tile-edit, .tile-edit:focus-visible{ opacity: 1; }
  .tile-edit:hover{ background: rgba(28,20,8,0.18); }

  .tile.used{
    background: linear-gradient(180deg, #3fbf74 0%, #1f8a4f 100%);
    color: #ecfff3;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.18);
    cursor: default;
    font-size: 22px;
  }
  .tile.used:hover{ transform:none; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.18); }

  .tile-award{
    font-family: var(--body);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: none;
    color: var(--ink);
    padding: 1px 7px;
    border-radius: 999px;
  }
  .tile-award.team-a{ background: var(--team-a); }
  .tile-award.team-b{ background: var(--team-b); }
  .tile-award.team-c{ background: var(--team-c); }
  .tile-award.team-d{ background: var(--team-d); }
  .tile-award.team-e{ background: var(--team-e); }
  .tile-award.team-f{ background: var(--team-f); }

  /* ---------- Progress strip ---------- */
  .progress-strip{
    height: 8px;
    border-radius: 999px;
    background: rgba(251,242,217,0.08);
    overflow: hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background: linear-gradient(90deg, var(--buzz-red), var(--marquee-gold));
    transition: width 0.35s ease;
  }

  /* ---------- Round complete banner ---------- */
  .round-banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 12px;
    flex-wrap: wrap;
    background: rgba(63,191,116,0.12);
    border: 1px solid rgba(63,191,116,0.4);
    border-radius: 12px;
    padding: 14px 18px;
  }
  .round-banner[hidden]{ display:none; }
  .round-banner-msg{
    margin:0;
    font-weight:700;
    font-size: 14px;
    color: #baf5cf;
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position: fixed; inset:0;
    background: rgba(4,12,18,0.72);
    backdrop-filter: blur(2px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 20px;
    z-index: 10;
  }
  .modal-overlay[hidden]{ display:none; }
  .modal{
    width:100%;
    max-width: 520px;
    max-height: 88vh;
    overflow-y: auto;
    background: linear-gradient(180deg, #0f3348 0%, var(--stage-navy-2) 100%);
    border: 1px solid rgba(245,182,14,0.35);
    border-radius: 14px;
    padding: 26px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  }
  .modal-kicker{
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(251,242,217,0.55);
    margin: 0 0 4px;
  }
  .modal-points{
    font-family: var(--display);
    font-size: 34px;
    font-weight:900;
    color: var(--marquee-gold);
    margin: 0 0 16px;
    font-variant-numeric: tabular-nums;
  }
  .field-label{
    display:block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: rgba(251,242,217,0.55);
    margin: 14px 0 6px;
  }
  .field-label:first-of-type{ margin-top:0; }
  textarea, input[type="number"]{
    width:100%;
    font-family: var(--body);
    font-size: 15px;
    line-height:1.4;
    color: var(--card-cream);
    background: rgba(251,242,217,0.06);
    border: 1px solid rgba(251,242,217,0.2);
    border-radius: 8px;
    padding: 10px 12px;
  }
  textarea{ min-height: 64px; resize: vertical; }
  textarea:focus, input[type="number"]:focus{ outline: 2px solid var(--marquee-gold); border-color: transparent; }

  .qa-text{
    font-size: 17px;
    line-height:1.5;
    color: var(--card-cream);
    margin: 0;
  }
  .answer-block{
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed rgba(245,182,14,0.3);
  }
  .answer-block .qa-text{ color: var(--marquee-gold); font-weight:600; }
  .explanation-text{
    font-size: 14px;
    line-height: 1.55;
    color: rgba(251,242,217,0.68);
    margin: 8px 0 0;
  }

  .modal-actions{
    display:flex;
    gap:10px;
    margin-top: 22px;
    flex-wrap:wrap;
  }
  .modal-actions .spacer{ flex:1; }

  .award-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 8px;
  }
  .team-btn{
    color: var(--btn-color);
    border-color: var(--btn-color);
    background: color-mix(in srgb, var(--btn-color) 14%, transparent);
  }
  .team-btn:hover{ background: color-mix(in srgb, var(--btn-color) 26%, transparent); }
  .team-btn.team-a{ --btn-color: var(--team-a); }
  .team-btn.team-b{ --btn-color: var(--team-b); }
  .team-btn.team-c{ --btn-color: var(--team-c); }
  .team-btn.team-d{ --btn-color: var(--team-d); }
  .team-btn.team-e{ --btn-color: var(--team-e); }
  .team-btn.team-f{ --btn-color: var(--team-f); }
  .team-btn.minus{
    background: transparent;
    border-style: dashed;
  }
  .team-btn.active{
    background: var(--btn-color);
    border-style: solid;
    color: var(--ink);
    box-shadow: 0 0 0 2px rgba(0,0,0,0.25) inset;
  }

  .empty-hint{
    font-size: 13px;
    color: rgba(251,242,217,0.45);
    margin-top: 10px;
  }

  @media (max-width: 640px){
    .board{ gap:4px; padding:6px; }
    .topic-cell{ min-height:52px; font-size:10px; }
    .tile{ min-height:52px; font-size:18px; }
  }
</style>

<div class="stage">
  <header class="marquee">
    <div class="buzzer-mark" aria-hidden="true"></div>
    <div class="marquee-text">
      <h1 id="showTitle" contenteditable="true" spellcheck="false" aria-label="Quiz title, click to edit"></h1>
      <p class="marquee-sub">Click a tile for the question, then show the answer and award or pass · <span id="progressLabel">0 / 25</span> played</p>
    </div>
  </header>

  <div class="scoreboard" id="scoreboard"></div>

  <div class="turn-banner" id="turnBanner"></div>

  <div class="controls">
    <button id="setupTeamsBtn" type="button">🎲 Setup teams</button>
    <button id="addTopicBtn" type="button">+ Add topic</button>
    <button id="removeTopicBtn" type="button" class="ghost">− Remove topic</button>
    <span class="spacer"></span>
    <button id="resetBtn" type="button" class="danger">Reset board</button>
  </div>

  <div class="board" id="board"></div>

  <div class="progress-strip" aria-hidden="true">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="round-banner" id="roundBanner" hidden>
    <p class="round-banner-msg" id="roundBannerMsg"></p>
    <button id="nextRoundBtn" type="button">Next round →</button>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal" id="modalBody" role="dialog" aria-modal="true" aria-labelledby="modalPoints"></div>
</div>

<script>
(function(){
  var STORAGE_KEY = 'quiz-dashboard-state-v14';
  var DEFAULT_POINTS = [10,20,30,40,50];
  var MIN_TOPICS = 3, MAX_TOPICS = 6;
  var TEAM_LETTERS = ['a','b','c','d','e','f'];
  var DEFAULT_PLAYERS = ["Robin","Ananya","Atul","Amol","Sherl","Kittu","Shijan","Tanu","Samarth"];

  function teamLetter(idx){ return TEAM_LETTERS[idx] || 'a'; }

  var ROUNDS = [
    {
      title: 'ROUND 1',
      topics: ["Origins of English Words","Indian Brands","Women of India","Who is X","Cars & Racing"],
      questions: [
        [
          { q:"Which English word for a learned expert or self-styled authority comes from a Sanskrit term for a scholar versed in traditional law and ritual?", a:"Pundit", e:"It entered English via Hindi during the colonial era, originally referring specifically to Hindu scholars advising British courts." },
          { q:"Which English word for a violent criminal comes from a Hindi and Sanskrit term meaning 'cheat' or 'swindler,' later applied by British colonial administrators to alleged organized gangs of robbers across India?", a:"Thug", e:"The word is 'thag'; the scale and organization of the so-called 'Thuggee' network described by British officials is now considered by many historians to have been significantly exaggerated." },
          { q:"Which English word, meaning easy or comfortable, entered British slang via Hindi and is thought to derive from a word meaning 'pleasant' or 'happy'?", a:"Cushy", e:"It's believed to come from Hindi 'khush' (happy), picked up by British soldiers stationed in India." },
          { q:"Which English word for a small boat entered the language via Anglo-Indian usage in the 19th century, borrowed almost unchanged from a Bengali and Hindi term for the same kind of vessel?", a:"Dinghy", e:"The word entered English almost unchanged from the Bengali and Hindi 'dingi.'" },
          { q:"Which English word for a covered porch attached to a house entered English via Hindi after British colonists encountered a similar architectural feature in India?", a:"Veranda", e:"Some etymologists also trace a Portuguese influence on the word's spread into English." }
        ],
        [
          { q:"Which Indian company's very first product, launched in the late 19th century, was a lock so secure it couldn't be picked using the spring-manipulation tools common at the time — because it didn't use a spring at all?", a:"Godrej", e:"It was founded by Ardeshir Godrej in 1897; the company later expanded far beyond locks into appliances, furniture, and real estate." },
          { q:"Which iconic Indian scooter, launched in 1972, was named after the legendary warhorse of a 16th-century Rajput king famed for his resistance to Mughal rule?", a:"The Bajaj Chetak", e:"The horse belonged to Maharana Pratap, hero of the Battle of Haldighati." },
          { q:"Which car, launched in India in 1983 through a joint venture with a Japanese manufacturer, is widely credited with putting car ownership within reach of India's middle class for the first time?", a:"The Maruti 800", e:"The Japanese partner was Suzuki; it remained India's best-selling car for over two decades." },
          { q:"Which car, based on a 1950s British design and produced virtually unchanged for over five decades, became the standard-issue vehicle for Indian government officials and is still a common sight as a taxi in Kolkata?", a:"The Hindustan Ambassador", e:"It was based on the Morris Oxford Series III and produced by Hindustan Motors from 1958 until 2014." },
          { q:"Which Indian adhesive brand built its advertising identity around absurdist scenarios of impossibly overloaded trucks, furniture, or crowds held together purely by its product?", a:"Fevicol", e:"It's manufactured by Pidilite Industries." }
        ],
        [
          { q:"Which 19th-century Indian social reformer, who opened one of the country's first schools for girls alongside her husband in 1848, is widely regarded as India's first female teacher?", a:"Savitribai Phule", e:"She and her husband, Jyotirao Phule, opened the school in Pune, facing considerable social hostility at the time." },
          { q:"Which 13th-century ruler became the only woman ever to sit on the throne of the Delhi Sultanate, reigning for roughly four years before being overthrown?", a:"Razia Sultana", e:"She was the daughter of Sultan Iltutmish and ruled from 1236 to 1240." },
          { q:"Which royal figure, wife of an exiled Nawab, led an armed rebellion against British forces in Lucknow during the 1857 uprising, ultimately fleeing to Nepal rather than surrender?", a:"Begum Hazrat Mahal", e:"Her husband was Wajid Ali Shah, the deposed Nawab of Awadh." },
          { q:"Which Indian revolutionary unfurled an early version of what's now recognized as a precursor to the Indian national flag, at an international socialist conference in Germany in 1907?", a:"Madam Bhikaji Cama", e:"The conference was held in Stuttgart." },
          { q:"Which Indian freedom fighter and politician became the country's first female Chief Minister of a state, taking office in Uttar Pradesh in 1963?", a:"Sucheta Kriplani", e:"She was also a member of the Constituent Assembly that helped draft India's Constitution." }
        ],
        [
          { q:"Which now-globally-dominant tech company was originally developed under the working name 'BackRub,' referencing the way its search algorithm analyzed links pointing back to a webpage?", a:"Google", e:"It was renamed after 'googol,' a mathematical term for the number 1 followed by 100 zeros — though the spelling was changed, reportedly by accident." },
          { q:"Which company's founder originally wanted to call it 'Cadabra,' before abandoning the idea after a lawyer misheard it over the phone as a word for a dead body?", a:"Amazon", e:"Jeff Bezos eventually settled on Amazon, partly for its association with size and partly because it starts with 'A.'" },
          { q:"Which coffee chain took its name from a character in a 19th-century American novel about a whaling voyage, chosen for its seafaring and trade associations?", a:"Starbucks", e:"The character is Starbuck, the first mate in Herman Melville's Moby-Dick." },
          { q:"Which two rival sportswear companies were founded by estranged brothers who had originally run a single shoe business together, before a bitter post-war falling out split both the company and, reportedly, their small German hometown?", a:"Adidas and Puma", e:"Adolf 'Adi' Dassler founded Adidas; his brother Rudolf founded Puma; the town was Herzogenaurach." },

          { q:"Which medication was originally developed and tested as a treatment for high blood pressure and chest pain, before a notable side effect observed during clinical trials led to it being repurposed entirely?", a:"Viagra (sildenafil)", e:"The side effect was noticed during trials for angina; Pfizer pivoted the drug's development, and it launched under its new purpose in 1998." },
          { q:"Which breakfast cereal was invented by a doctor running a health sanitarium in Michigan, as part of a bland, plain diet intended to keep his patients healthy?", a:"Corn Flakes", e:"The doctor was John Harvey Kellogg, of Battle Creek Sanitarium fame." },
          { q:"Which soft drink was created by a pharmacist in the 1890s and named after a digestive enzyme, having originally been marketed as a remedy for stomach ailments?", a:"Pepsi", e:"The pharmacist was Caleb Bradham; the drink was first called 'Brad's Drink' before being renamed." }
        ]
      ]
    }
  ];

  function shuffle(arr){
    var a = arr.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i+1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function buildCellsForRound(idx){
    var cells = {};
    ROUNDS[idx].questions.forEach(function(colQuestions, col){
      colQuestions.forEach(function(item, row){
        cells[col + '-' + row] = { question: item.q, answer: item.a, explanation: item.e || '', used: false };
      });
    });
    return cells;
  }

  function defaultTeams(){
    return [
      { name:'Team 1', score:0, players:["Samarth","Tanu","Sherl"] },
      { name:'Team 2', score:0, players:["Kittu","Atul","Shijan"] },
      { name:'Team 3', score:0, players:["Robin","Ananya","Amol"] }
    ];
  }

  function defaultState(){
    return {
      roundIndex: 0,
      currentTurn: 0,
      title: ROUNDS[0].title,
      topics: ROUNDS[0].topics.slice(),
      teams: defaultTeams(),
      cells: buildCellsForRound(0)
    };
  }

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if(!parsed.topics || !parsed.topics.length) return defaultState();
      if(!parsed.teams || !parsed.teams.length) parsed.teams = defaultTeams();
      if(typeof parsed.roundIndex !== 'number') parsed.roundIndex = 0;
      if(typeof parsed.currentTurn !== 'number') parsed.currentTurn = 0;
      return parsed;
    }catch(e){ return defaultState(); }
  }

  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function cellKey(col,row){ return col+'-'+row; }

  var state = load();

  var boardEl = document.getElementById('board');
  var scoreboardEl = document.getElementById('scoreboard');
  var titleEl = document.getElementById('showTitle');
  var progressLabel = document.getElementById('progressLabel');
  var progressFill = document.getElementById('progressFill');
  var roundBanner = document.getElementById('roundBanner');
  var roundBannerMsg = document.getElementById('roundBannerMsg');
  var nextRoundBtn = document.getElementById('nextRoundBtn');
  var turnBanner = document.getElementById('turnBanner');
  var overlay = document.getElementById('modalOverlay');
  var modalBody = document.getElementById('modalBody');

  function preventEnterNewline(e){
    if(e.key === 'Enter'){ e.preventDefault(); e.target.blur(); }
  }

  titleEl.textContent = state.title;

  titleEl.addEventListener('keydown', preventEnterNewline);
  titleEl.addEventListener('blur', function(){
    state.title = titleEl.textContent.trim() || 'QUIZ NIGHT';
    titleEl.textContent = state.title;
    save();
  });

  function renderScoreboard(){
    scoreboardEl.innerHTML = '';
    state.teams.forEach(function(team, idx){
      var letter = teamLetter(idx);

      var card = document.createElement('div');
      card.className = 'team-card team-' + letter + (idx === state.currentTurn ? ' active-turn' : '');

      var main = document.createElement('div');
      main.className = 'team-main';

      var name = document.createElement('div');
      name.className = 'team-name';
      name.contentEditable = 'true';
      name.spellcheck = false;
      name.textContent = team.name;
      name.setAttribute('aria-label', 'Team ' + (idx+1) + ' name, click to rename');
      name.addEventListener('keydown', preventEnterNewline);
      name.addEventListener('blur', function(){
        team.name = name.textContent.trim() || ('Team ' + (idx+1));
        name.textContent = team.name;
        save();
        renderBoard();
      });
      main.appendChild(name);

      if(team.players && team.players.length){
        var roster = document.createElement('div');
        roster.className = 'team-roster';
        roster.textContent = team.players.join(' · ');
        main.appendChild(roster);
      }

      var score = document.createElement('div');
      score.className = 'team-score';
      score.contentEditable = 'true';
      score.spellcheck = false;
      score.textContent = team.score;
      score.setAttribute('aria-label', team.name + ' score, click to edit');
      score.addEventListener('keydown', preventEnterNewline);
      score.addEventListener('blur', function(){
        var val = parseInt(score.textContent.replace(/[^-0-9]/g,''), 10);
        if(isNaN(val)) val = 0;
        team.score = val;
        score.textContent = val;
        save();
      });

      card.appendChild(main);
      card.appendChild(score);
      scoreboardEl.appendChild(card);
    });

    renderTurnBanner();
  }

  function renderTurnBanner(){
    var team = state.teams[state.currentTurn];
    if(!team){
      turnBanner.textContent = '';
      turnBanner.style.removeProperty('--turn-color');
      return;
    }
    turnBanner.textContent = team.name + '’s turn';
    turnBanner.style.setProperty('--turn-color', 'var(--team-' + teamLetter(state.currentTurn) + ')');
  }

  function advanceTurn(){
    if(state.teams.length){
      state.currentTurn = (state.currentTurn + 1) % state.teams.length;
    }
  }

  function renderBoard(){
    boardEl.style.setProperty('--cols', state.topics.length);
    boardEl.innerHTML = '';

    state.topics.forEach(function(topic, col){
      var t = document.createElement('div');
      t.className = 'topic-cell';
      t.contentEditable = 'true';
      t.spellcheck = false;
      t.textContent = topic;
      t.setAttribute('aria-label', 'Topic ' + (col+1) + ', click to rename');
      t.addEventListener('keydown', preventEnterNewline);
      t.addEventListener('blur', function(){
        var val = t.textContent.trim() || ('Topic ' + (col+1));
        state.topics[col] = val;
        t.textContent = val;
        save();
      });
      boardEl.appendChild(t);
    });

    DEFAULT_POINTS.forEach(function(points, row){
      state.topics.forEach(function(topic, col){
        var key = cellKey(col,row);
        var cell = state.cells[key];
        var used = cell && cell.used;
        var hasContent = cell && cell.question;

        var tile = document.createElement('div');
        tile.className = 'tile' + (used ? ' used' : '') + (hasContent && !used ? ' has-content' : '');
        tile.setAttribute('aria-label', topic + ' for ' + points + (used ? ', already played' : ''));

        var num = document.createElement('span');
        num.textContent = used ? '✓' : points;
        tile.appendChild(num);

        if(used){
          tile.setAttribute('aria-disabled', 'true');
          (cell.awards || []).forEach(function(award){
            var team = state.teams[award.team];
            var pill = document.createElement('span');
            pill.className = 'tile-award team-' + teamLetter(award.team);
            var sign = award.delta >= 0 ? '+' : '−';
            pill.textContent = (team ? team.name : 'Team ' + (award.team+1)) + ' ' + sign + Math.abs(award.delta);
            tile.appendChild(pill);
          });
        } else {
          tile.tabIndex = 0;
          tile.setAttribute('role', 'button');

          var editBtn = document.createElement('button');
          editBtn.type = 'button';
          editBtn.className = 'tile-edit';
          editBtn.textContent = '✎';
          editBtn.setAttribute('aria-label', 'Add or edit question for ' + topic + ', ' + points + ' points');
          editBtn.addEventListener('click', function(e){
            e.stopPropagation();
            openEdit(col,row,points,topic);
          });
          tile.appendChild(editBtn);

          tile.addEventListener('click', function(){ openTile(col,row,points,topic); });
          tile.addEventListener('keydown', function(e){
            if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openTile(col,row,points,topic); }
          });
        }

        boardEl.appendChild(tile);
      });
    });

    updateProgress();
  }

  function finalizeAward(col,row,selections){
    var key = cellKey(col,row);
    var cell = state.cells[key] || { question:'', answer:'', explanation:'', used:false };
    cell.used = true;
    var awards = [];
    Object.keys(selections).forEach(function(k){
      var delta = selections[k];
      if(delta){
        var idx = parseInt(k,10);
        awards.push({ team: idx, delta: delta });
        state.teams[idx].score += delta;
      }
    });
    cell.awards = awards;
    state.cells[key] = cell;
    advanceTurn();
    save();
    closeModal();
    renderBoard();
    renderScoreboard();
  }

  function updateProgress(){
    var total = state.topics.length * DEFAULT_POINTS.length;
    var used = 0;
    Object.keys(state.cells).forEach(function(k){
      var col = parseInt(k.split('-')[0],10);
      if(col < state.topics.length && state.cells[k].used) used++;
    });
    progressLabel.textContent = used + ' / ' + total;
    progressFill.style.width = (total ? (used/total*100) : 0) + '%';

    if(total > 0 && used === total){
      roundBanner.hidden = false;
      var hasNext = state.roundIndex + 1 < ROUNDS.length;
      if(hasNext){
        roundBannerMsg.textContent = 'Round complete!';
        nextRoundBtn.hidden = false;
        nextRoundBtn.textContent = 'Start ' + ROUNDS[state.roundIndex+1].title + ' →';
      } else {
        roundBannerMsg.textContent = 'Round complete — that’s the last board ready. Ask for more questions to keep playing.';
        nextRoundBtn.hidden = true;
      }
    } else {
      roundBanner.hidden = true;
    }
  }

  nextRoundBtn.addEventListener('click', function(){
    var nextIdx = state.roundIndex + 1;
    if(nextIdx >= ROUNDS.length) return;
    state.roundIndex = nextIdx;
    state.title = ROUNDS[nextIdx].title;
    state.topics = ROUNDS[nextIdx].topics.slice();
    state.cells = buildCellsForRound(nextIdx);
    save();
    titleEl.textContent = state.title;
    renderBoard();
    renderScoreboard();
  });

  function closeModal(){
    overlay.hidden = true;
    modalBody.innerHTML = '';
  }

  function openTile(col,row,points,topic){
    var key = cellKey(col,row);
    var cell = state.cells[key] || { question:'', answer:'', explanation:'', used:false };
    renderPlayModal(col,row,points,topic,cell,false,{});
    overlay.hidden = false;
  }

  function renderPlayModal(col,row,points,topic,cell,revealAnswer,selections){
    selections = selections || {};
    modalBody.className = 'modal';
    modalBody.innerHTML = '';

    var kicker = document.createElement('p');
    kicker.className = 'modal-kicker';
    kicker.textContent = topic;
    modalBody.appendChild(kicker);

    var pts = document.createElement('p');
    pts.className = 'modal-points';
    pts.id = 'modalPoints';
    pts.textContent = points + ' points';
    modalBody.appendChild(pts);

    if(cell.question){
      var qText = document.createElement('p');
      qText.className = 'qa-text';
      qText.textContent = cell.question;
      modalBody.appendChild(qText);

      if(revealAnswer){
        var ansWrap = document.createElement('div');
        ansWrap.className = 'answer-block';
        var aText = document.createElement('p');
        aText.className = 'qa-text';
        aText.textContent = cell.answer || '(no answer set)';
        ansWrap.appendChild(aText);
        if(cell.explanation){
          var eText = document.createElement('p');
          eText.className = 'explanation-text';
          eText.textContent = cell.explanation;
          ansWrap.appendChild(eText);
        }
        modalBody.appendChild(ansWrap);
      } else {
        var revealBtn = document.createElement('button');
        revealBtn.type = 'button';
        revealBtn.className = 'ghost';
        revealBtn.textContent = 'Show answer';
        revealBtn.addEventListener('click', function(){
          renderPlayModal(col,row,points,topic,cell,true,selections);
        });
        modalBody.appendChild(revealBtn);
      }
    } else {
      var hint = document.createElement('p');
      hint.className = 'empty-hint';
      hint.textContent = 'No question saved for this tile — use the ✎ on the tile to add one.';
      modalBody.appendChild(hint);
    }

    var awardLabel = document.createElement('label');
    awardLabel.className = 'field-label';
    awardLabel.textContent = 'Award ' + points + ' points';
    modalBody.appendChild(awardLabel);

    var grid = document.createElement('div');
    grid.className = 'award-grid';

    state.teams.forEach(function(team, idx){
      var letter = teamLetter(idx);
      var isPlus = selections[idx] === points;
      var isMinus = selections[idx] === -points;

      var plusBtn = document.createElement('button');
      plusBtn.type = 'button';
      plusBtn.className = 'team-btn team-' + letter + (isPlus ? ' active' : '');
      plusBtn.textContent = '+' + points + ' ' + team.name;
      plusBtn.setAttribute('aria-pressed', isPlus ? 'true' : 'false');
      plusBtn.addEventListener('click', function(){
        var next = Object.assign({}, selections);
        next[idx] = isPlus ? undefined : points;
        renderPlayModal(col,row,points,topic,cell,revealAnswer,next);
      });
      grid.appendChild(plusBtn);

      var minusBtn = document.createElement('button');
      minusBtn.type = 'button';
      minusBtn.className = 'team-btn minus team-' + letter + (isMinus ? ' active' : '');
      minusBtn.textContent = '−' + points + ' ' + team.name;
      minusBtn.setAttribute('aria-pressed', isMinus ? 'true' : 'false');
      minusBtn.addEventListener('click', function(){
        var next = Object.assign({}, selections);
        next[idx] = isMinus ? undefined : -points;
        renderPlayModal(col,row,points,topic,cell,revealAnswer,next);
      });
      grid.appendChild(minusBtn);
    });

    modalBody.appendChild(grid);

    var multiHint = document.createElement('p');
    multiHint.className = 'empty-hint';
    multiHint.textContent = 'Select more than one team if several are scored on this question, e.g. docking two teams for a wrong buzz.';
    modalBody.appendChild(multiHint);

    var hasSelection = Object.keys(selections).some(function(k){ return selections[k]; });

    var actions = document.createElement('div');
    actions.className = 'modal-actions';

    var applyBtn = document.createElement('button');
    applyBtn.type = 'button';
    applyBtn.textContent = hasSelection ? 'Award points' : 'Pass (no score)';
    applyBtn.addEventListener('click', function(){ finalizeAward(col,row,selections); });
    actions.appendChild(applyBtn);

    var spacer = document.createElement('span');
    spacer.className = 'spacer';
    actions.appendChild(spacer);

    var cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'ghost';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.addEventListener('click', closeModal);
    actions.appendChild(cancelBtn);

    modalBody.appendChild(actions);
  }

  function openEdit(col,row,points,topic){
    var key = cellKey(col,row);
    var cell = state.cells[key] || { question:'', answer:'', explanation:'', used:false };
    renderEditModal(col,row,points,topic,cell);
    overlay.hidden = false;
  }

  function renderEditModal(col,row,points,topic,cell){
    modalBody.className = 'modal';
    modalBody.innerHTML = '';

    var kicker = document.createElement('p');
    kicker.className = 'modal-kicker';
    kicker.textContent = topic;
    modalBody.appendChild(kicker);

    var pts = document.createElement('p');
    pts.className = 'modal-points';
    pts.id = 'modalPoints';
    pts.textContent = points + ' points';
    modalBody.appendChild(pts);

    var qLabel = document.createElement('label');
    qLabel.className = 'field-label';
    qLabel.textContent = 'Question';
    modalBody.appendChild(qLabel);

    var qInput = document.createElement('textarea');
    qInput.value = cell.question || '';
    qInput.placeholder = 'What gets asked for ' + points + ' points…';
    modalBody.appendChild(qInput);

    var aLabel = document.createElement('label');
    aLabel.className = 'field-label';
    aLabel.textContent = 'Answer';
    modalBody.appendChild(aLabel);

    var aInput = document.createElement('textarea');
    aInput.value = cell.answer || '';
    aInput.placeholder = 'The correct response…';
    modalBody.appendChild(aInput);

    var eLabel = document.createElement('label');
    eLabel.className = 'field-label';
    eLabel.textContent = 'Explanation (optional)';
    modalBody.appendChild(eLabel);

    var eInput = document.createElement('textarea');
    eInput.value = cell.explanation || '';
    eInput.placeholder = 'A sentence of context shown alongside the answer…';
    modalBody.appendChild(eInput);

    var actions = document.createElement('div');
    actions.className = 'modal-actions';

    var saveBtn = document.createElement('button');
    saveBtn.type = 'button';
    saveBtn.textContent = 'Save';
    saveBtn.addEventListener('click', function(){
      state.cells[cellKey(col,row)] = {
        question: qInput.value.trim(),
        answer: aInput.value.trim(),
        explanation: eInput.value.trim(),
        used: cell.used || false,
        awards: cell.awards
      };
      save();
      closeModal();
      renderBoard();
    });

    var cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'ghost';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.addEventListener('click', closeModal);

    actions.appendChild(saveBtn);
    actions.appendChild(cancelBtn);
    modalBody.appendChild(actions);
  }

  function randomizeTeams(count, playersRaw){
    var players = playersRaw.split(/[,\n]/).map(function(s){ return s.trim(); }).filter(Boolean);
    var shuffled = shuffle(players);
    var teams = [];
    for(var i = 0; i < count; i++){
      teams.push({ name: 'Team ' + (i+1), score: 0, players: [] });
    }
    shuffled.forEach(function(p, i){ teams[i % count].players.push(p); });
    return teams;
  }

  function openTeamSetup(){
    renderTeamSetupModal();
    overlay.hidden = false;
  }

  function renderTeamSetupModal(){
    modalBody.className = 'modal';
    modalBody.innerHTML = '';

    var kicker = document.createElement('p');
    kicker.className = 'modal-kicker';
    kicker.textContent = 'New game';
    modalBody.appendChild(kicker);

    var heading = document.createElement('p');
    heading.className = 'modal-points';
    heading.textContent = 'Setup teams';
    modalBody.appendChild(heading);

    var countLabel = document.createElement('label');
    countLabel.className = 'field-label';
    countLabel.textContent = 'Number of teams';
    modalBody.appendChild(countLabel);

    var countInput = document.createElement('input');
    countInput.type = 'number';
    countInput.min = '2';
    countInput.max = '6';
    countInput.value = state.teams.length || 3;
    modalBody.appendChild(countInput);

    var playersLabel = document.createElement('label');
    playersLabel.className = 'field-label';
    playersLabel.textContent = 'Players';
    modalBody.appendChild(playersLabel);

    var existingPlayers = [];
    state.teams.forEach(function(t){ if(t.players) existingPlayers = existingPlayers.concat(t.players); });
    var playersInput = document.createElement('textarea');
    playersInput.value = existingPlayers.length ? existingPlayers.join(', ') : DEFAULT_PLAYERS.join(', ');
    playersInput.placeholder = 'One per line, or comma-separated…';
    modalBody.appendChild(playersInput);

    var hint = document.createElement('p');
    hint.className = 'empty-hint';
    hint.textContent = 'Randomize deals players evenly across the teams. Reopen this anytime to reshuffle.';
    modalBody.appendChild(hint);

    var actions = document.createElement('div');
    actions.className = 'modal-actions';

    var randomizeBtn = document.createElement('button');
    randomizeBtn.type = 'button';
    randomizeBtn.textContent = 'Randomize teams';
    randomizeBtn.addEventListener('click', function(){
      var count = Math.max(2, Math.min(6, parseInt(countInput.value, 10) || 3));
      state.teams = randomizeTeams(count, playersInput.value);
      state.currentTurn = 0;
      save();
      closeModal();
      renderScoreboard();
      renderBoard();
    });
    actions.appendChild(randomizeBtn);

    var spacer = document.createElement('span');
    spacer.className = 'spacer';
    actions.appendChild(spacer);

    var cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'ghost';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.addEventListener('click', closeModal);
    actions.appendChild(cancelBtn);

    modalBody.appendChild(actions);
  }

  overlay.addEventListener('click', function(e){
    if(e.target === overlay) closeModal();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && !overlay.hidden) closeModal();
  });

  document.getElementById('setupTeamsBtn').addEventListener('click', openTeamSetup);

  document.getElementById('addTopicBtn').addEventListener('click', function(){
    if(state.topics.length >= MAX_TOPICS) return;
    state.topics.push('New Topic');
    save();
    renderBoard();
  });

  document.getElementById('removeTopicBtn').addEventListener('click', function(){
    if(state.topics.length <= MIN_TOPICS) return;
    var removedCol = state.topics.length - 1;
    state.topics.pop();
    Object.keys(state.cells).forEach(function(k){
      if(parseInt(k.split('-')[0],10) === removedCol) delete state.cells[k];
    });
    save();
    renderBoard();
  });

  document.getElementById('resetBtn').addEventListener('click', function(){
    modalBody.className = 'modal';
    modalBody.innerHTML = '';

    var kicker = document.createElement('p');
    kicker.className = 'modal-kicker';
    kicker.textContent = 'Reset board';
    modalBody.appendChild(kicker);

    var msg = document.createElement('p');
    msg.className = 'qa-text';
    msg.textContent = 'This clears all topics, questions, answers and scores, and cannot be undone.';
    modalBody.appendChild(msg);

    var actions = document.createElement('div');
    actions.className = 'modal-actions';

    var confirmBtn = document.createElement('button');
    confirmBtn.type = 'button';
    confirmBtn.className = 'danger';
    confirmBtn.textContent = 'Reset everything';
    confirmBtn.addEventListener('click', function(){
      state = defaultState();
      titleEl.textContent = state.title;
      save();
      closeModal();
      renderBoard();
      renderScoreboard();
      openTeamSetup();
    });
    actions.appendChild(confirmBtn);

    var spacer = document.createElement('span');
    spacer.className = 'spacer';
    actions.appendChild(spacer);

    var cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'ghost';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.addEventListener('click', closeModal);
    actions.appendChild(cancelBtn);

    modalBody.appendChild(actions);
    overlay.hidden = false;
  });

  renderBoard();
  renderScoreboard();
})();
</script>
